# Include inside an HTTPS server block for the chosen domain.
# TLS certificates and a domain must be supplied by the deployment environment.
client_max_body_size 25m;
client_body_timeout 30s;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
# Requires deploy/nginx-rate-limits.conf in the enclosing http {} context.
location /api/convert/ {
    limit_req zone=docflow_conversions burst=2 nodelay;
    limit_req_status 429;
    limit_conn docflow_clients 2;
    limit_conn_status 429;
    proxy_pass http://127.0.0.1:4173;
    proxy_set_header Host $host;
    proxy_read_timeout 130s;
    proxy_request_buffering off;
    proxy_buffering off;
}
location / {
    proxy_pass http://127.0.0.1:4173;
    proxy_set_header Host $host;
    proxy_read_timeout 130s;
    proxy_request_buffering off;
    proxy_buffering off;
}
