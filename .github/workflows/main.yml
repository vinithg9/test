name: DocFlow Browser Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test docx xlsx pdf-lib mammoth
          npx playwright install --with-deps chromium
      - name: Run DocFlow browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          cat > smoke.spec.cjs <<'EOF'
          const { test, expect } = require('@playwright/test');
          const site = 'http://127.0.0.1:4173/docflow-single-file.html';
          test.beforeEach(async ({page}) => { await page.goto(site); });
          test('homepage and all tool entry points render', async ({page}) => {
            await expect(page).toHaveTitle(/DocFlow/);
            await expect(page.locator('[data-tool]')).toHaveCount(4);
            await expect(page.locator('[data-quick]')).toHaveCount(5);
          });
          test('every visible homepage button has an accessible name', async ({page}) => {
            for (const button of await page.locator('button:visible').all()) {
              await expect(button).toHaveAccessibleName(/\S/);
            }
          });
          for (const [tool, title] of [['word','Word Editor'],['excel','Excel Editor'],['pdf','PDF Tools'],['convert','File Converter']]) {
            test(tool + ' opens and closes workspace', async ({page}) => {
              await page.locator('[data-tool="'+tool+'"]').click();
              await expect(page.locator('#workspace')).toBeVisible();
              await expect(page.locator('#workspace-title')).toHaveText(title);
              await page.locator('#close-workspace').click();
              await expect(page.locator('#workspace')).not.toBeVisible();
            });
          }
          test('Word editor accepts and retains typed text', async ({page}) => {
            await page.locator('[data-tool="word"]').click();
            await page.locator('#word-editor').fill('DocFlow end to end sample');
            await expect(page.locator('#word-editor')).toHaveText('DocFlow end to end sample');
          });
          test('Excel editor accepts cell edits', async ({page}) => {
            await page.locator('[data-tool="excel"]').click();
            const cell=page.locator('.sheet td[data-r="0"][data-c="0"]');
            await cell.fill('42');
            await expect(cell).toHaveText('42');
          });
          test('quick tools open the expected workspace', async ({page}) => {
            await page.locator('[data-quick="wordpdf"]').click();
            await expect(page.locator('#conversion-type')).toHaveValue('wordpdf');
          });
          test('no uncaught JavaScript errors on initial load', async ({page}) => {
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.reload();
            await page.waitForTimeout(500);
            expect(errors).toEqual([]);
          });
          EOF
          npx playwright test smoke.spec.cjs tests/document-e2e.spec.cjs --reporter=html,line
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docflow-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
