name: DocFlow Release Verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install sandbox and document renderers
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer libreoffice-calc bubblewrap fonts-dejavu-core
          python -m pip install -r server/requirements.txt pillow openpyxl
      - name: Audit conversion dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r server/requirements.txt --format json -o dependency-audit.json
      - name: Verify sandbox capability
        run: python scripts/check-sandbox.py
      - name: Verify secure service and layout preservation
        run: python -m unittest discover -s tests -p test_conversion_service.py -v
      - name: Install pinned verification dependencies
        run: npm install --no-save @playwright/test@1.64.1 docx@9.5.1 https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz pdf-lib@1.17.1 mammoth@1.9.1
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify release workflows
        run: npx playwright test
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docflow-release-evidence
          path: |
            dependency-audit.json
            playwright-report/
            test-results/
          retention-days: 30
