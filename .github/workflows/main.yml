name: DocFlow Release Verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned verification dependencies
        run: npm install --no-save @playwright/test@1.56.1 docx@9.5.1 xlsx@0.18.5 pdf-lib@1.17.1 mammoth@1.9.1
      - name: Install browsers
        run: npx playwright install --with-deps chromium
      - name: Verify release workflows
        run: npx playwright test
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docflow-release-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 30
